name: Feature request
description: Propose a capability or improvement for the Invokyr Save Editor.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first. Describe the need and outcome, not only a
        preferred implementation. Requests that depend on game data are easier to
        evaluate when you say which field or screen of the game they relate to.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need or workflow is not handled well today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a user be able to do when this is addressed?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, constraints, screenshots without personal data, or references that clarify the request.
